name: Build Chess Analyzer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessAnalyzer_1.2_SOURCE_UPLOAD.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          test -f ChessAnalyzer_1.2_SOURCE_UPLOAD.zip
          unzip -l ChessAnalyzer_1.2_SOURCE_UPLOAD.zip | grep -q 'android/app/build.gradle'

      - name: Extract Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q ChessAnalyzer_1.2_SOURCE_UPLOAD.zip -d build-src
          test -f build-src/android/app/build.gradle
          test -f build-src/android/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: build-src/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        run: |
          APK="$(find build-src/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" ChessAnalyzer-1.2.0-debug.apk
          ls -lh ChessAnalyzer-1.2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessAnalyzer-1.2.0-APK
          path: ChessAnalyzer-1.2.0-debug.apk
          retention-days: 90

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.0-build-${{ github.run_number }}"
          gh release create "$TAG" ChessAnalyzer-1.2.0-debug.apk \
            --title "Chess Analyzer 1.2.0 - Build ${{ github.run_number }}" \
            --generate-notes
