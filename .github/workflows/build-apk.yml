name: Build Chess Analyzer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o chess_analyzer_android_project.zip
          echo "Project extracted"
          find . -maxdepth 3 -type f | head -100

      - name: Enable AndroidX
        working-directory: android
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Fix Kotlin duplicate dependencies
        working-directory: android
        run: |
          cat > fix.gradle <<'EOF'
          allprojects {
            configurations.all {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.kotlin") {
                  details.useVersion "1.8.22"
                }
              }
            }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --init-script fix.gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAnalyzer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
